<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body style="margin: 0;">
  <canvas id="canvas" style="width: 100vw; height: calc(100vw * 1000 / 1400);" width="1400" height="1000"></canvas>

  3 <input type="checkbox" id="3-toggle" onchange="update()">
  5 <input type="checkbox" id="5-toggle" onchange="update()">
  7 <input type="checkbox" id="7-toggle" onchange="update()">
  11 <input type="checkbox" id="11-toggle" onchange="update()">
  <br>
  ignore inverse <input type="checkbox" id="inverse-toggle" onchange="update()">

  <!-- <input type="number" id="overtone-step" value="0" min="0" max="11" onchange="update()"> -->

  <script>
    /** @type {HTMLCanvasElement} */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function update() {
      console.log("update");

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 1400, 1000);

      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(100, 100);
      ctx.lineTo(1300, 100);
      ctx.stroke();


      ctx.font = "30px Arial";
      ["D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B", "C", "Db", "D"].forEach((c, i) => {
        ctx.fillText(c, 90 + i * 100, 90);
      });

      ctx.font = "30px Arial";
      ctx.fillText("12 edo", 0, 150);
      ctx.beginPath();
      Array.from({ length: 12 + 1 }).forEach((_, i) => {
        ctx.moveTo(100 + i * 100, 100);
        ctx.lineTo(100 + i * 100, 200);
      });
      ctx.stroke();

      ctx.font = "20px Arial";
      ctx.fillText("Hundotte's", 0, 225);
      ctx.fillText("Custom", 0, 250);
      ctx.fillText("tuning", 0, 275);
      ctx.fillText("system", 0, 300);
      const HUNDOTTE = [0, -34, 4, 17, -15, -2, -31, -20, 14, -14, -34, -10];
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + i * 100 + c, 200);
        ctx.lineTo(100 + i * 100 + c, 600);
      });
      ctx.moveTo(100 + 12 * 100 + 0, 200);
      ctx.lineTo(100 + 12 * 100 + 0, 600);
      ctx.stroke();

      // mark
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + i * 100 + c, 200 + (i + 0.2) * (100 / 3));
        ctx.lineTo(100 + i * 100 + c, 200 + (i + 0.8) * (100 / 3));
        ctx.lineTo(100 + i * 100 + c + 20, 200 + (i + 0.5) * (100 / 3));
      });
      ctx.fill();

      // 3
      ctx.strokeStyle = "#f00";
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + (i * 100 + c + 1200 * Math.log2(3)) % 1200, 200 + i * (100 / 3));
        ctx.lineTo(100 + (i * 100 + c + 1200 * Math.log2(3)) % 1200, 200 + (i + 1) * (100 / 3));
      });
      ctx.stroke();

      // 5
      ctx.strokeStyle = "#0f0";
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + (i * 100 + c + 1200 * Math.log2(5)) % 1200, 200 + i * (100 / 3));
        ctx.lineTo(100 + (i * 100 + c + 1200 * Math.log2(5)) % 1200, 200 + (i + 1) * (100 / 3));
      });
      ctx.stroke();

      // 7
      ctx.strokeStyle = "#f0f";
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + (i * 100 + c + 1200 * Math.log2(7)) % 1200, 200 + i * (100 / 3));
        ctx.lineTo(100 + (i * 100 + c + 1200 * Math.log2(7)) % 1200, 200 + (i + 1) * (100 / 3));
      });
      ctx.stroke();

      // 11
      ctx.strokeStyle = "#fb0";
      ctx.beginPath();
      HUNDOTTE.forEach((c, i) => {
        ctx.moveTo(100 + (i * 100 + c + 1200 * Math.log2(11)) % 1200, 200 + i * (100 / 3));
        ctx.lineTo(100 + (i * 100 + c + 1200 * Math.log2(11)) % 1200, 200 + (i + 1) * (100 / 3));
      });
      ctx.stroke();

      // const step = parseInt(document.getElementById("overtone-step").value);
      for (let step = 0; step < 12; step++) {
        ctx.font = "12px Arial";
        ((primes) => {
          const rawRatios = [];

          primes.forEach(p => {
            rawRatios.push({ origNum: p, origDen: 1, numPrimes: [p], denPrimes: [] });
            rawRatios.push({ origNum: 1, origDen: p, numPrimes: [], denPrimes: [p] });
          });

          primes.forEach(p => {
            rawRatios.push({ origNum: p * p, origDen: 1, numPrimes: [p, p], denPrimes: [] });
            rawRatios.push({ origNum: 1, origDen: p * p, numPrimes: [], denPrimes: [p, p] });
          });

          for (let i = 0; i < primes.length; i++) {
            for (let j = i + 1; j < primes.length; j++) {
              const p1 = primes[i];
              const p2 = primes[j];
              rawRatios.push({ origNum: p1 * p2, origDen: 1, numPrimes: [p1, p2], denPrimes: [] });
              rawRatios.push({ origNum: 1, origDen: p1 * p2, numPrimes: [], denPrimes: [p2, p1] });
            }
          }

          primes.forEach(pNum => {
            primes.forEach(pDen => {
              rawRatios.push({ origNum: pNum, origDen: pDen, numPrimes: [pNum], denPrimes: [pDen] });
            });
          });

          const uniqueMap = new Map();
          const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

          rawRatios.forEach(item => {
            if (item.origDen === 1 && primes.includes(item.origNum)) {
              return;
            }

            let n = item.origNum;
            let d = item.origDen;
            while (n / d < 1.0) { n *= 2; }
            while (n / d >= 2.0) { d *= 2; }

            const g = gcd(n, d);
            n /= g;
            d /= g;

            const ratioValue = n / d;

            if (ratioValue !== 1 && !uniqueMap.has(ratioValue)) {
              uniqueMap.set(ratioValue, { n, d, item });
            }
          });

          const sortedRatios = Array.from(uniqueMap.values()).sort((a, b) => (a.n / a.d) - (b.n / b.d));

          return sortedRatios.map(({ n, d, item }) => {
            const allPrimes = [...item.numPrimes, ...item.denPrimes];
            const maxPrime = Math.max(...allPrimes);

            let color = "#a00";
            if (maxPrime === 5) color = "#0a0";
            if (maxPrime === 7) color = "#a0a";
            if (maxPrime === 11) color = "#a80";

            let hasInverseToggle = false;
            if (item.denPrimes.length > 0) {
              if (item.numPrimes.length === 0) {
                hasInverseToggle = true;
              } else {
                const pNum = item.numPrimes[0];
                const pDen = item.denPrimes[0];
                if (pDen > pNum) {
                  hasInverseToggle = true;
                }
              }
            }

            const toggleEl = document.getElementById(`${maxPrime}-toggle`);
            const inverseEl = document.getElementById("inverse-toggle");

            const isChecked = toggleEl ? toggleEl.checked : false;
            const isInverseNotChecked = inverseEl ? !inverseEl.checked : true;

            const conditionValue = hasInverseToggle ? (isChecked && isInverseNotChecked) : isChecked;

            return [n / d, `${n}/${d}`, color, conditionValue];
          });
        })([3, 5, 7, 11]).forEach((i, j) => {
          if (i[3]) {
            ctx.fillStyle = i[2];
            ctx.beginPath();
            ctx.moveTo(100 + (step * 100 + HUNDOTTE[step] + 1200 * Math.log2(i[0])) % 1200, 200 + (step + 0.7) * (100 / 3));
            ctx.lineTo(100 + ((step * 100 + HUNDOTTE[step] + 1200 * Math.log2(i[0])) % 1200) + 6, 200 + (step + 0.5) * (100 / 3));
            ctx.lineTo(100 + (step * 100 + HUNDOTTE[step] + 1200 * Math.log2(i[0])) % 1200, 200 + (step + 0.3) * (100 / 3));
            ctx.lineTo(100 + (step * 100 + HUNDOTTE[step] + 1200 * Math.log2(i[0])) % 1200 - 6, 200 + (step + 0.5) * (100 / 3));
            ctx.fill();
            ctx.fillText(`${i[1]}`, 100 + (step * 100 + HUNDOTTE[step] + 1200 * Math.log2(i[0])) % 1200 + 5, 200 + (step) * (100 / 3) + 12);
          }
        });
      }

      ctx.font = "30px Arial";
      ctx.fillStyle = "#fff";
      ctx.fillText("31 edo", 0, 650);
      ctx.strokeStyle = "#fff";
      ctx.beginPath();
      Array.from({ length: 31 + 1 }).forEach((_, i) => {
        ctx.moveTo(100 + i * 1200 / 31, 600);
        ctx.lineTo(100 + i * 1200 / 31, 700);
      });
      ctx.stroke();
    }
    update();

  </script>
</body>

</html>
